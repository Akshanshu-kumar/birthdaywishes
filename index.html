<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Birthday Wish 🎉</title>
<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow-x: hidden;
}
.container {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}
h1 {
    font-size: 2rem;
    color: #fff;
    text-shadow: 0 0 10px gold, 0 0 20px orange;
    margin-bottom: 15px;
}
button {
    padding: 12px 25px;
    margin-top: 15px;
    font-size: 1rem;
    border: none;
    border-radius: 25px;
    background: linear-gradient(45deg, gold, orange);
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition: transform 0.2s, box-shadow 0.2s;
}
button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
.wish {
    display: none;
    margin-top: 30px;
    animation: fadeIn 1.5s ease-in-out;
}
.wish h2 {
    font-size: 1.8rem;
    color: rgb(0, 195, 255);
    text-shadow: 0 0 10px white, 0 0 20px orange;
}
.wish p {
    font-size: 1.2rem;
    color: white;
    margin-top: 10px;
    line-height: 1.4;
}
@keyframes fadeIn {from {opacity:0;} to {opacity:1;}}
/* Confetti */
.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    border-radius: 50%;
    opacity: 0.8;
    animation: fall 4s linear infinite;
}
@keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
}
/* Cake */
.cake {
    margin: 40px auto 20px auto;
    position: relative;
    width: 200px;
}
.cake-base {
    background: #8b4513;
    width: 200px;
    height: 100px;
    border-radius: 0 0 20px 20px;
}
.cake-top {
    background: rgb(255, 221, 248);
    width: 200px;
    height: 50px;
    border-radius: 20px 20px 0 0;
}
.candle {
    position: absolute;
    top: -40px;
    width: 15px;
    height: 40px;
    background: yellow;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 3px;
}
.flame {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 15px;
    height: 15px;
    background: orange;
    border-radius: 50%;
    display: none;
    animation: flicker 0.15s infinite alternate;
}
@keyframes flicker {
    0% { transform: translateX(-50%) scale(1); background: rgb(255, 17, 0); }
    100% { transform: translateX(-50%) scale(1.2); background: rgb(255, 0, 0); }
}
/* Sparkles background */
.sparkle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    top: 0; left: 0;
    opacity: 0.8;
    border-radius: 50%;
    animation: sparkleAnim 3s linear infinite;
}
@keyframes sparkleAnim {
    0% { transform: translate(0,0) scale(1); opacity:0.8; }
    100% { transform: translate(100vw,100vh) scale(0.5); opacity:0; }
}
</style>
</head>
<body>

<div class="container">
    <!-- <h1>🎉 Enter the Birthday Star's Name 🎉</h1>
    <input type="text" id="nameInput" placeholder="Enter Name" />
    <br> -->
    <button onclick="showWish()">click here to Celebrate 🎂</button>
    <br>
    <br> 
    <br>
    <div class="wish" id="wishSection">
        <div class="cake">
            <div class="candle"><div class="flame"></div></div>
            <div class="cake-top"></div>
            <div class="cake-base"></div>
        </div>
        <h2 id="wishText"></h2>
        <h2 id="wishText1"></h2>
        <p id="message"></p>
    </div>
</div>

<script>
function showWish() {
    // const name = document.getElementById("nameInput").value.trim() || "Friend";
    document.getElementById("wishSection").style.display = "block";
    document.getElementById("wishText").innerHTML = `🎂 Happy Birthday, 🎂`;
    document.getElementById("wishText1").innerHTML = `🎂 Bhaiyaa! 🎂`;
    document.getElementById("message").innerHTML = `May your special day be filled with love, laughter, and endless joy. You deserve the world and more! 🌟💖`;

    // Light candle
    document.querySelector(".flame").style.display = "block";

    // Confetti
    for(let i=0;i<50;i++){
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random()*100 + "vw";
        confetti.style.backgroundColor = `hsl(${Math.random()*360},100%,50%)`;
        confetti.style.animationDuration = (Math.random()*3 + 2) + "s";
        document.body.appendChild(confetti);
        // setTimeout(()=> confetti.remove(), 5000);
    }

    // Sparkles background
    for(let i=0;i<20;i++){
        const sparkle = document.createElement("div");
        sparkle.classList.add("sparkle");
        sparkle.style.left = Math.random()*100 + "vw";
        sparkle.style.top = Math.random()*100 + "vh";
        sparkle.style.animationDuration = (Math.random()*3 + 2) + "s";
        document.body.appendChild(sparkle);
        // setTimeout(()=> sparkle.remove(), 3000);
    }
}

// Enter key trigger
document.getElementById("nameInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") showWish();
});
</script>

</body>
</html>
